  <style>
    :root {
      --coral: #E8605A;
      --lav: #9B8EC4;
      --cream: #FAF6F0;
      --dark: #1E1E1E;
      --text: #3A3A3A;
      --muted: #7A7A7A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      line-height: 1.65;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #fff;
      border-radius: 28px;
      padding: clamp(40px, 6vw, 56px);
      text-align: center;
      box-shadow: 0 12px 48px rgba(44,44,44,0.1);
    }
    .tag {
      display: inline-block;
      font-size: 0.9375rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lav);
      background: #EAE6F5;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 900;
      color: var(--dark);
      line-height: 1.2;
      margin-bottom: 16px;
    }
    h1 .script {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      color: var(--coral);
      display: block;
      font-size: 1.15em;
      margin-top: 6px;
    }
    p {
      font-size: 1.0625rem;
      color: var(--muted);
      margin-bottom: 32px;
    }
    a.btn {
      display: inline-block;
      background: var(--coral);
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform .2s, box-shadow .2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(232,96,90,.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Messaggio inviato</span>
    <h1>
      Grazie per avermi scritto
      <span class="script">ti rispondo entro 24 ore</span>
    </h1>
    <p>Ho ricevuto la tua richiesta e la leggerò con attenzione. Ti contatterò presto.</p>
    <a href="/" class="btn">Torna alla landing</a>
  </main>
</body>
</html>
